<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="shortcut icon" href="./assets/sunny.png" type="image/x-icon" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Application</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <div class="logo">
        <img src="./assets/sunny.png" alt="logo-image" />
        <h3>Royal<span>Sky</span></h3>
      </div>
      <div class="weather-input">
        <input type="search" placeholder="Enter your city name..." />
        <button class="fetch-btn">🔍</button>
      </div>
    </header>

    <main class="main">
      <div class="container">
        <div class="weather-info">
          <p class="country-name">
            The city of <span class="country">PK</span>
          </p>
          <h1 class="city-name">Lahore</h1>
          <p class="population-info">
            Population <span class="population">6310888</span> citizens
          </p>
        </div>

        <div class="weather-forcast">
          <div class="forcast-content"></div>
        </div>

        <p class="weather-paragraph">
          🔥 Your trusted weather companion for accurate forecasts, real-time
          conditions, and weather updates. 🚀
        </p>
      </div>
    </main>

    <footer class="footer">
      <p>© 2026 ROYALSKY. All Rights Reserved.</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
