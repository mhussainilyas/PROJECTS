<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="shortcut icon" href="./assets/icon.png" type="image/x-icon" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Switcher | By WebFlexer</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="script.js"></script>
  </head>
  <body>
    <main class="main">
      <h1 class="main-heading">Color Swither App</h1>

      <div class="color-actions">
        <button class="random-color btn">Random Color</button>
        <input
          type="text"
          placeholder="Enter color or hex code..."
          class="color-input"
        />
        <button class="apply-color btn">Apply Color</button>
      </div>

      <p class="color-info">
        Active color is <span class="current-color">#FFE0E0</span>
      </p>
    </main>
  </body>
</html>
